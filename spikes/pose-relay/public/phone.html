<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally spike: phone</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px -apple-system, sans-serif; }
  #stage { position: relative; width: 100vw; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; }
  #hud { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; background: #000c; }
  button { font-size: 20px; padding: 12px 20px; }
</style>
</head>
<body>
<div id="stage"><video id="cam" playsinline muted></video><canvas id="overlay"></canvas></div>
<div id="hud">
  <button id="start">Start camera</button>
  <button id="flip">Flip camera</button>
  <div id="stats">idle</div>
</div>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("cam");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const statsEl = document.getElementById("stats");

let wsNote = "socket connecting";
window.onerror = (m) => { statsEl.textContent = `JS error: ${m}`; };
let landmarker, ws, lastRtt = 0, frames = 0, since = performance.now(), fps = 0;

document.getElementById("start").onclick = async () => {
  try { await start(); } catch (err) { statsEl.textContent = `start failed: ${err.name}: ${err.message}`; }
};

async function start() {
  statsEl.textContent = "loading model...";
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await PoseLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numPoses: 1,
  });
  await openCamera();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ws = new WebSocket(`wss://${location.host}/ws?role=phone`);
  ws.onerror = () => { wsNote = "socket ERROR"; };
  ws.onclose = (e) => { wsNote = `socket closed ${e.code}`; };
  ws.onopen = () => { wsNote = "socket open"; };
  ws.onmessage = (e) => {
    const { pong } = JSON.parse(e.data);
    if (pong) lastRtt = performance.now() - pong;
  };
  loop();
}

// Front camera by default so a solo user can see themselves; the preview is mirrored like a selfie.
let facing = "user";
async function openCamera() {
  video.srcObject?.getTracks().forEach((t) => t.stop());
  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: 640, height: 480 },
    audio: false,
  });
  await video.play();
  document.getElementById("stage").style.transform = facing === "user" ? "scaleX(-1)" : "";
}

document.getElementById("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  if (landmarker) await openCamera();
};

function loop() {
  const now = performance.now();
  const result = landmarker.detectForVideo(video, now);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const pose = result.landmarks[0];
  if (pose) {
    new DrawingUtils(ctx).drawConnectors(pose, PoseLandmarker.POSE_CONNECTIONS, { color: "#0f0", lineWidth: 3 });
    if (ws.readyState === 1) {
      // Keypoints only: x, y, visibility rounded to 3 decimals. No video leaves the phone.
      const kp = pose.map((p) => [+p.x.toFixed(3), +p.y.toFixed(3), +(p.visibility ?? 0).toFixed(2)]);
      ws.send(JSON.stringify({ kp, sentTs: now }));
    }
  }
  frames++;
  if (now - since > 1000) {
    fps = (frames * 1000) / (now - since);
    frames = 0;
    since = now;
    statsEl.textContent = `inference ${fps.toFixed(1)} fps · relay RTT ${lastRtt.toFixed(0)} ms · pose ${pose ? "yes" : "no"} · ${wsNote}`;
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>

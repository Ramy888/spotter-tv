<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Spotter camera</title>
<style>
  :root { --bg: #0b0b0f; --fg: #f2f2f5; --muted: #9a9aa6; --accent: #44ccff; --warn: #ffcc66; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 8px 0 0; font-size: 28px; color: var(--accent); }
  p { margin: 0; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: 600 28px/1 ui-monospace, Menlo, monospace; letter-spacing: 6px; text-transform: uppercase;
          padding: 12px; border-radius: 12px; border: 2px solid #33333d; background: #15151c; color: var(--fg); text-align: center; }
  button { font: 600 18px/1 inherit; padding: 14px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #002233; }
  button.secondary { background: #24242d; color: var(--fg); }
  #stage { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #15151c; border-radius: 16px; overflow: hidden; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  #status { font-weight: 600; }
  .ok { color: var(--accent); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  #stats { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Spotter</h1>

  <section id="join">
    <p>Enter the code shown on your TV.</p>
    <form id="codeForm" autocomplete="off">
      <input id="code" maxlength="6" inputmode="text" autocapitalize="characters" aria-label="Pairing code" required>
      <button type="submit">Join</button>
    </form>
  </section>

  <section id="session" hidden>
    <div id="stage"><video id="cam" playsinline muted></video><canvas id="overlay"></canvas></div>
    <div id="status" class="warn">Connecting…</div>
    <p id="hint">Lean your phone upright about 2.5–3 m away so your whole body is in view.</p>
    <div class="row">
      <button id="flip" class="secondary" type="button">Flip camera</button>
      <button id="leave" class="secondary" type="button">Leave</button>
    </div>
    <div id="stats"></div>
  </section>
</main>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const SEND_FPS = 15;           // enough for rep counting; keeps relay traffic and cost down
const PING_EVERY_MS = 1000;    // only some frames carry a timestamp for round-trip measurement
const CODE_RE = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$/;

const $ = (id) => document.getElementById(id);
const config = await fetch("config.json").then((r) => r.json());

let landmarker, ws, code, facing = "user", lastSent = 0, lastPing = 0, rtt = null, frames = 0, fps = 0, since = performance.now();

// Coach voice: the TV decides what to say; when it can't play audio itself, the phone speaks.
// iPhone only allows audio after a tap, so the context is created in the Join tap handler.
let audio = null;
const clips = new Map(); // clip id -> decoded AudioBuffer
const queue = [];
let speaking = false;

async function preloadVoice() {
  try {
    const { counts, groups } = await fetch("audio/clips.json").then((r) => r.json());
    const ids = [...Array.from({ length: counts }, (_, i) => `count-${i + 1}`),
      ...Object.entries(groups).flatMap(([g, n]) => Array.from({ length: n }, (_, i) => `${g}-${i + 1}`))];
    await Promise.all(ids.map(async (id) => {
      const data = await fetch(`audio/${id}.mp3`).then((r) => r.arrayBuffer());
      clips.set(id, await audio.decodeAudioData(data));
    }));
  } catch (err) {
    console.warn("voice preload failed", err);
  }
}

function speakNext() {
  const buffer = clips.get(queue.shift());
  if (!buffer) { speaking = false; if (queue.length) speakNext(); return; }
  speaking = true;
  const source = audio.createBufferSource();
  source.buffer = buffer;
  source.connect(audio.destination);
  source.onended = () => (queue.length ? speakNext() : (speaking = false));
  source.start();
}

function say(ids) {
  if (!audio) return;
  queue.push(...ids);
  queue.splice(0, Math.max(0, queue.length - 3)); // never fall behind the workout: keep the newest
  if (!speaking) speakNext();
}
let leaving = false;

function setStatus(text, cls) {
  $("status").textContent = text;
  $("status").className = cls;
}

function connect() {
  ws = new WebSocket(`${config.relayUrl}?role=phone&code=${code}`);
  ws.onopen = () => setStatus("Connected to your TV", "ok");
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.pong !== undefined) rtt = performance.now() - msg.pong;
    if (msg.type === "say" && Array.isArray(msg.clips)) say(msg.clips);
    if (msg.type === "tv-left") setStatus("Your TV closed the session. Start a new one on the TV.", "bad");
  };
  ws.onclose = () => {
    if (leaving) return;
    // A rejected code closes before opening; an established link that drops (screen lock, Wi-Fi) retries.
    if (!ws.everOpened) {
      setStatus("That code didn't work. Check the code on your TV.", "bad");
      return;
    }
    setStatus("Reconnecting…", "warn");
    setTimeout(connect, 1500);
  };
  ws.addEventListener("open", () => { ws.everOpened = true; });
}

async function openCamera() {
  $("cam").srcObject?.getTracks().forEach((t) => t.stop());
  $("cam").srcObject = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: 640, height: 480 },
    audio: false,
  });
  await $("cam").play();
  $("overlay").width = $("cam").videoWidth;
  $("overlay").height = $("cam").videoHeight;
  $("stage").classList.toggle("mirror", facing === "user");
}

async function start(joinCode) {
  code = joinCode;
  $("join").hidden = true;
  $("session").hidden = false;
  history.replaceState(null, "", `?code=${code}`);
  try {
    setStatus("Loading pose model…", "warn");
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await PoseLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numPoses: 1,
    });
    await openCamera();
  } catch (err) {
    setStatus(`Camera or model failed: ${err.message}`, "bad");
    return;
  }
  connect();
  requestAnimationFrame(loop);
}

// Broadcast-style skeleton: body-weighted limbs with a soft glow, a translucent torso, clean
// joints, one head ring instead of face dots, joints fading with low confidence, and a live
// knee-angle arc. Widths are in canvas pixels, scaled to the video size.
const ACCENT = "#C8FF3D";
const CUE = "#FFB547";
const LIMBS = [ // [from, to, width]
  [11, 13, 9], [13, 15, 7], [12, 14, 9], [14, 16, 7], // arms
  [23, 25, 15], [25, 27, 12], [24, 26, 15], [26, 28, 12], // legs
];
const JOINTS = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
const BIG_JOINTS = new Set([23, 24, 25, 26]);

const confidence = (p) => Math.min(1, Math.max(0.12, ((p.visibility ?? 0) - 0.3) / 0.5));

function angleAt(a, b, c) {
  const ab = Math.atan2(a.y - b.y, a.x - b.x);
  const cb = Math.atan2(c.y - b.y, c.x - b.x);
  let d = Math.abs(ab - cb) * 180 / Math.PI;
  return d > 180 ? 360 - d : d;
}

function drawSkeleton(ctx, pose, w, h, mirrored) {
  const s = w / 400;
  const P = pose.map((p) => ({ x: p.x * w, y: p.y * h, a: confidence(p) }));
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Torso as one translucent shape.
  const torso = [P[11], P[12], P[24], P[23]];
  ctx.globalAlpha = Math.min(...torso.map((p) => p.a));
  ctx.beginPath();
  torso.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
  ctx.fillStyle = "rgba(200, 255, 61, 0.14)";
  ctx.fill();
  ctx.lineWidth = 3 * s;
  ctx.strokeStyle = ACCENT;
  ctx.stroke();

  // Limbs: a wide faint glow pass, then the solid stroke.
  for (const [i, j, width] of LIMBS) {
    const alpha = Math.min(P[i].a, P[j].a);
    for (const [extra, op] of [[14, 0.22], [0, 1]]) {
      ctx.globalAlpha = alpha * op;
      ctx.lineWidth = (width + extra) * s;
      ctx.beginPath();
      ctx.moveTo(P[i].x, P[i].y);
      ctx.lineTo(P[j].x, P[j].y);
      ctx.stroke();
    }
  }

  // Head ring sized from the ears, plus the neck.
  const head = P[0];
  const r = Math.max(14 * s, Math.hypot(P[7].x - P[8].x, P[7].y - P[8].y) * 0.75);
  const neck = { x: (P[11].x + P[12].x) / 2, y: (P[11].y + P[12].y) / 2 };
  ctx.globalAlpha = head.a;
  ctx.lineWidth = 4 * s;
  ctx.beginPath();
  ctx.arc(head.x, head.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = 8 * s;
  ctx.beginPath();
  ctx.moveTo(head.x, head.y + r);
  ctx.lineTo(neck.x, neck.y);
  ctx.stroke();

  // Joints: dark centre, accent ring.
  for (const k of JOINTS) {
    ctx.globalAlpha = P[k].a;
    ctx.beginPath();
    ctx.arc(P[k].x, P[k].y, (BIG_JOINTS.has(k) ? 9 : 7) * s, 0, Math.PI * 2);
    ctx.fillStyle = "#0A0B10";
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.stroke();
  }

  // Knee-angle arc on the more bent, clearly visible knee.
  const legs = [[23, 25, 27], [24, 26, 28]].filter(([h2, k, a]) => Math.min(P[h2].a, P[k].a, P[a].a) > 0.6);
  const bent = legs.map(([h2, k, a]) => ({ k, h2, a, deg: angleAt(P[h2], P[k], P[a]) })).sort((x, y) => x.deg - y.deg)[0];
  ctx.globalAlpha = 1;
  if (bent && bent.deg < 165) {
    const knee = P[bent.k];
    const a1 = Math.atan2(P[bent.h2].y - knee.y, P[bent.h2].x - knee.x);
    const a2 = Math.atan2(P[bent.a].y - knee.y, P[bent.a].x - knee.x);
    let start = a1, end = a2;
    if (((end - start + Math.PI * 3) % (Math.PI * 2)) - Math.PI < 0) [start, end] = [end, start];
    ctx.strokeStyle = CUE;
    ctx.lineWidth = 5 * s;
    ctx.beginPath();
    ctx.arc(knee.x, knee.y, 30 * s, start, end);
    ctx.stroke();

    // Label: drawn un-mirrored so the number reads correctly on the front camera.
    const label = `${Math.round(bent.deg)}°`;
    const lx = knee.x + (mirrored ? -1 : 1) * 46 * s;
    ctx.save();
    if (mirrored) {
      ctx.translate(lx, 0);
      ctx.scale(-1, 1);
      ctx.translate(-lx, 0);
    }
    ctx.font = `900 ${20 * s}px Archivo, system-ui, sans-serif`;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = CUE;
    ctx.beginPath();
    ctx.roundRect(lx - 8 * s, knee.y - 16 * s, tw + 16 * s, 32 * s, 8 * s);
    ctx.fill();
    ctx.fillStyle = "#1A1206";
    ctx.textBaseline = "middle";
    ctx.fillText(label, lx, knee.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function loop() {
  const now = performance.now();
  const ctx = $("overlay").getContext("2d");
  const pose = landmarker.detectForVideo($("cam"), now).landmarks[0];
  ctx.clearRect(0, 0, $("overlay").width, $("overlay").height);

  if (pose) {
    drawSkeleton(ctx, pose, $("overlay").width, $("overlay").height, facing === "user");
    if (ws?.readyState === WebSocket.OPEN && now - lastSent >= 1000 / SEND_FPS) {
      // Keypoints only: video never leaves the phone.
      // t = capture time, so the TV times reps by when they happened, not when frames arrived.
      const msg = { t: Math.round(now), kp: pose.map((p) => [+p.x.toFixed(3), +p.y.toFixed(3), +(p.visibility ?? 0).toFixed(2)]) };
      if (now - lastPing >= PING_EVERY_MS) {
        msg.sentTs = now;
        lastPing = now;
      }
      ws.send(JSON.stringify(msg));
      lastSent = now;
    }
  }

  frames++;
  if (now - since >= 1000) {
    fps = Math.round((frames * 1000) / (now - since));
    frames = 0;
    since = now;
    $("stats").textContent = `code ${code} · tracking ${fps} fps · sending ${SEND_FPS}/s · round trip ${rtt == null ? "–" : Math.round(rtt) + " ms"}`;
  }
  if (!leaving) requestAnimationFrame(loop);
}

$("codeForm").onsubmit = (e) => {
  e.preventDefault();
  const value = $("code").value.trim().toUpperCase();
  if (CODE_RE.test(value)) {
    // Must happen inside the tap: browsers only allow audio that starts from a user gesture.
    audio = new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    preloadVoice();
    start(value);
  }
  else $("code").select();
};
$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  if (landmarker) await openCamera();
};
$("leave").onclick = () => {
  leaving = true;
  ws?.close();
  $("cam").srcObject?.getTracks().forEach((t) => t.stop());
  location.href = location.pathname;
};

const fromLink = new URLSearchParams(location.search).get("code")?.toUpperCase();
if (fromLink && CODE_RE.test(fromLink)) {
  // Camera access needs a user gesture on iOS, so a scanned QR link still asks for one tap.
  $("code").value = fromLink;
}
</script>
</body>
</html>
